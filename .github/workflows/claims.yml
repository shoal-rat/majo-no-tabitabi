name: Claims

# `/claim` and `/unclaim` comments on issues (CONTRIBUTING.md). Runs the default branch's copy of
# `.github/scripts/claims.cjs`; no pull-request code is checked out here.
on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  command:
    name: Claim command
    if: ${{ !github.event.issue.pull_request && github.event.comment.user.type != 'Bot' && (contains(github.event.comment.body, '/claim') || contains(github.event.comment.body, '/unclaim')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    concurrency:
      group: claims-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const claims = require('./.github/scripts/claims.cjs');
            await claims.onComment({ github, context, core });

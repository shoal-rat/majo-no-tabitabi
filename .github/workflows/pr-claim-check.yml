name: Claim check

# A pull request must close an issue its author has claimed (CONTRIBUTING.md).
# Plain pull_request: fork pull requests get a read-only token, and the script only reads.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  claim:
    name: Claim check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    concurrency:
      group: claim-check-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const claims = require('./.github/scripts/claims.cjs');
            await claims.checkPull({ github, context, core });
